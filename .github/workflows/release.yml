# ============================================================================
# 发布流程 | Release pipeline
#
# 由 changesets 驱动的两段式发布 | A two-phase changesets release:
#   1. 带 changeset 的提交合进主干后，action 自动开一个 "version packages" PR，
#      里面是版本号与 CHANGELOG 的改动
#   2. 合并那个 PR，action 再次运行并执行 pnpm release 把包推上 npm
#
#   1. When commits carrying changesets land on the trunk, the action opens a
#      "version packages" PR with the version bump and CHANGELOG
#   2. Merging that PR triggers the action again, which runs pnpm release to publish
#
# 需要的仓库 Secret | Required repository secret:
#   NPM_TOKEN —— npm 上具备发布权限的 Automation Token
#   NPM_TOKEN: an npm automation token with publish rights
# ============================================================================

name: Release

on:
  push:
    branches:
      - [[ .BaseBranch ]]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # id-token 用于 npm provenance（溯源信息），缺少它 publish 会失败
  # id-token is required by npm provenance; publishing fails without it
  id-token: write

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 让 changesets 能读到完整历史，否则无法判断变更范围
      # Full history lets changesets determine what changed
      - name: 拉取代码 | Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm | Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node | Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '[[ .NodeVersion ]]'
          cache: pnpm
          registry-url: '[[ .NpmRegistry ]]'

      - name: 安装依赖 | Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 开版本 PR 或发布 | Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
