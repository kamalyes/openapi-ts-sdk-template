# ============================================================================
# kopy 模板配置 | kopy template configuration
#
# 用法 | Usage:
#   kopy new https://github.com/kamalyes/openapi-ts-sdk-template -o ./my-api-sdk
#   kopy list ./openapi-ts-sdk-template          # 查看全部变量 | inspect variables
#
# 渲染规则 | Rendering rules:
#   - 定界符是 [[ ]]，所有文件的「内容」和「路径」都会过一遍模板引擎
#   - Delimiters are [[ ]]; both file contents and paths go through the engine
#   - 变量值一律是字符串，判断布尔要写 eq .X "true"
#   - Every variable is a string, so booleans must be compared via eq .X "true"
# ============================================================================

name: openapi-ts-sdk
description: OpenAPI TypeScript SDK 模板 - 从远程 Swagger 文档生成、可直接发布到 npm 的 API 客户端 | Publishable TypeScript API SDK generated from remote OpenAPI documents
version: 1.0.0
author: kamalyes
tags: [typescript, openapi, swagger, sdk, npm, pnpm]

delimiters:
  - "[["
  - "]]"

questions:
  # --------------------------------------------------------------------------
  # 身份信息 | Identity
  # --------------------------------------------------------------------------
  - name: OrgName
    prompt: "组织名称（GitHub 组织或用户名）| GitHub org or user name"
    type: string
    default: kamalyes
    required: true

  - name: ProjectName
    prompt: "项目名称（仓库名 / 目录名，如 kronos-api-sdk）| Repository and directory name"
    type: string
    default: my-api-sdk
    required: true

  - name: PkgScope
    prompt: "npm scope（不要带 @，留空则生成不带 scope 的包名）| npm scope without @, empty for unscoped"
    type: string
    default: kamalyes

  - name: PkgName
    prompt: "npm 包名主体（不含 scope）| npm package name without scope"
    type: string
    default: "[[ .ProjectName ]]"
    required: true

  - name: PkgFullName
    prompt: "npm 完整包名（发布时真正使用的名字）| Full npm package name used when publishing"
    type: string
    default: "[[ if .PkgScope ]]@[[ .PkgScope ]]/[[ end ]][[ .PkgName ]]"
    required: true

  - name: Description
    prompt: "包描述（写入 package.json 与 README）| Package description for package.json and README"
    type: string
    default: Typed API SDK generated from remote OpenAPI documents
    required: true

  - name: AuthorName
    prompt: "作者名称 | Author name"
    type: string
    default: kamalyes
    required: true

  - name: AuthorEmail
    prompt: "作者邮箱 | Author email"
    type: string
    default: example@qq.com
    required: true

  # --------------------------------------------------------------------------
  # 远程 OpenAPI 文档 | Remote OpenAPI documents
  #
  # SDK 的唯一输入是远程 Swagger/OpenAPI 文档，不依赖本地 yaml 文件
  # 多个服务的文档在 openapi.config.mjs 的 sources 里继续追加即可
  #
  # The only input is a remote Swagger/OpenAPI document; no local yaml needed.
  # Add more services to the `sources` array in openapi.config.mjs.
  # --------------------------------------------------------------------------
  - name: SwaggerUrl
    prompt: "远程 OpenAPI 文档地址（默认是 Swagger 官方 Petstore 示例，可直接跑通后再换成你自己的）| Remote OpenAPI document URL, defaults to the public Swagger Petstore spec"
    type: string
    default: https://petstore3.swagger.io/api/v3/openapi.json
    required: true

  - name: TokenEnvName
    prompt: "拉取文档时读取 Bearer Token 的环境变量名 | Env var holding the Bearer token used while fetching"
    type: string
    default: OPENAPI_TOKEN
    required: true

  - name: ApiBasePath
    prompt: "默认 API 根地址（留空则由调用方传入 basePath）| Default API base path, empty means caller-supplied"
    type: string
    default: ""

  # --------------------------------------------------------------------------
  # 工程化选项 | Engineering options
  # --------------------------------------------------------------------------
  - name: NodeVersion
    prompt: "Node 版本（写入 engines / .nvmrc / CI）| Node version for engines, .nvmrc and CI"
    type: select
    choices: ["20", "22", "24"]
    default: "22"

  - name: BaseBranch
    prompt: "主干分支（CI 触发与 changesets 基线）| Trunk branch for CI triggers and changesets"
    type: select
    choices: ["master", "main"]
    default: "master"

  - name: NpmRegistry
    prompt: "npm registry（私服请填写私服地址）| npm registry, use your mirror for private hosting"
    type: string
    default: https://registry.npmjs.org
    required: true

  - name: GeneratorDep
    prompt: "生成器依赖源（openapi-generator-ts-cli 未发布 npm 时用 git dist 分支）| Install source of openapi-generator-ts-cli"
    type: string
    default: git+https://github.com/[[ .OrgName ]]/openapi-generator-ts-cli.git#dist
    required: true

# ============================================================================
# 忽略规则 | Ignore rules
#
# 这些文件只服务于模板仓库本身，不进入生成的项目
# These files serve the template repository itself and never reach the output.
# ============================================================================
ignore:
  - "kopy.yaml"
  # 模板自身的说明文档，改名后在此被忽略（见下方 rename 注释）
  # The template's own documentation, renamed then ignored (see rename below)
  - "__kopy_template_doc__"
  - ".git/"
  - ".git/**"
  - "node_modules/"
  - "dist/"
  - "coverage/"
  - "pnpm-lock.yaml"

# ============================================================================
# 重命名规则 | Rename rules
#
# 关键：kopy 的执行顺序是「先 rename 再 ignore」，前三条规则按顺序生效：
#   1. 先把模板自身的 README.md 改名成忽略标记，使它不进入生成项目
#   2. 再把 readme.tpl 落位成生成项目的中文 README.md（npm 包的门面）
#   3. readme-en.tpl 落位成英文 README.en.md，两份文档互相链接
# 顺序颠倒会导致生成项目没有 README，或者模板说明被当成项目 README
# 另外 "readme-en.tpl" 不含子串 "readme.tpl"，所以第 2 条规则不会误伤英文模板
#
# Important: kopy applies rename BEFORE ignore, and the first three rules are ordered:
#   1. Rename the template's own README.md to an ignore marker so it stays here
#   2. Materialize readme.tpl as the generated project's Chinese README.md
#   3. Materialize readme-en.tpl as the English README.en.md, cross-linked with it
# Swapping them either drops the README or ships the template docs as the README.
# Note that "readme-en.tpl" does not contain the substring "readme.tpl", so rule 2
# never touches the English template.
# ============================================================================
rename:
  # 工作流与 dependabot 配置在模板仓库里带 .tpl 后缀，渲染时去掉。
  # 原因：GitHub Actions 会解析模板仓库自己的 .github/workflows/*.yml，而里面的
  # 占位符还没渲染（branches: - [[ .BaseBranch ]] 会被 YAML 读成嵌套序列，直接报
  # "A sequence was not expected"），模板仓库会一直挂着无效工作流的红叉。
  # 加 .tpl 后 GitHub 既不解析也不触发它们，生成项目里又能正常还原。
  #
  # [EN] Workflow and dependabot files carry a .tpl suffix inside the template repository and
  # lose it on render. GitHub Actions parses .github/workflows/*.yml of the template repo
  # itself, where placeholders are still unrendered: `branches: - [[ .BaseBranch ]]` parses as
  # a nested sequence and fails with "A sequence was not expected". With .tpl, GitHub neither
  # parses nor triggers them, while the generated project still gets working files.
  - pattern: ".yml.tpl"
    value: ".yml"
  - pattern: "README.md"
    value: "__kopy_template_doc__"
  - pattern: "readme.tpl"
    value: "README.md"
  - pattern: "readme-en.tpl"
    value: "README.en.md"
  - pattern: "__project_name__"
    value: "[[ .ProjectName ]]"
  - pattern: "__pkg_name__"
    value: "[[ .PkgName ]]"

# ============================================================================
# 生命周期钩子 | Lifecycle hooks
#
# 注意：当前版本的 kopy 还没有真正执行 hooks（bootstrap/new.go 未调用），
# 这里先声明好，等 kopy 支持后即可自动初始化；在那之前请按生成项目 README 的
# 「首次初始化」章节手动执行这三步
#
# Note: the current kopy release does not execute hooks yet (bootstrap/new.go
# never calls them). The declaration is future-proofing; until then follow the
# "first run" section of the generated README manually.
# ============================================================================
hooks:
  after:
    - pnpm install
    - pnpm generate
    - pnpm build
